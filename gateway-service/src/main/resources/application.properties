spring.application.name=gateway-service

server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false

devpilot.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.config.import=optional:file:.env[.properties]
app.jwt.secret=${JWT_SECRET}

management.endpoints.web.exposure.include=health,info,gateway

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=gateway-service
springdoc.swagger-ui.urls[0].url=/v3/api-docs
springdoc.swagger-ui.urls[1].name=orchestrator-service
springdoc.swagger-ui.urls[1].url=/orchestrator/v3/api-docs
springdoc.swagger-ui.urls[2].name=ai-agent-service
springdoc.swagger-ui.urls[2].url=/ai-agent/v3/api-docs
springdoc.swagger-ui.urls[3].name=auth-service
springdoc.swagger-ui.urls[3].url=/auth/v3/api-docs