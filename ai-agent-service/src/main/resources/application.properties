spring.application.name=ai-agent-service
server.port=8082
spring.config.import=optional:file:.env[.properties]

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false
app.jwt.secret=${JWT_SECRET}

spring.ai.openai.chat.model=openai.gpt-5.2
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.base-url=${OPENAI_BASE_URL}

devpilot.workspace.root=${DEVPILOT_WORKSPACE_ROOT:./workspace}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devpilot}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

spring.ai.vectorstore.pgvector.dimensions=1024
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.initialize-schema =true
spring.ai.vectorstore.pgvector.remove-existing-vector-store-table = false

spring.ai.openai.embedding.model=amazon.titan-embed-text-v2:0

springdoc.api-docs.path=/v3/api-docs