# Test configuration for ai-agent-service.
# Secrets read from the environment first; placeholder fallbacks let the context
# load offline. A local (gitignored) `.env` in this module overrides anything here.
spring.application.name=ai-agent-service
server.port=0
spring.config.import=optional:file:.env[.properties]

eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

app.jwt.secret=${JWT_SECRET:ZGV2cGlsb3QtdGVzdC1qd3Qtc2VjcmV0LWRvLW5vdC11c2U=}
spring.ai.openai.api-key=${OPENAI_API_KEY:test}
spring.ai.openai.base-url=${OPENAI_BASE_URL:http://localhost:9999/v1}

devpilot.workspace.root=${DEVPILOT_WORKSPACE_ROOT:./target/test-workspace}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devpilot}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.ai.vectorstore.pgvector.dimensions=1024
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.remove-existing-vector-store-table=false

spring.ai.openai.embedding.model=amazon.titan-embed-text-v2:0
